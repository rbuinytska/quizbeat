<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18122B"/>
      <stop offset="50%" stop-color="#2D033B"/>
      <stop offset="100%" stop-color="#0F0C20"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGlow)" stroke-width="8" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Vinyl record -->
  <circle cx="256" cy="256" r="160" fill="url(#vinylGrad)" stroke="#333344" stroke-width="3"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#2a2a38" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#2a2a38" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#2a2a38" stroke-width="1.5"/>

  <!-- Center label -->
  <circle cx="256" cy="256" r="54" fill="url(#neonGlow)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#0f0c20"/>

  <!-- Musical Note + Lightning bolt -->
  <path d="M236 170 L286 150 L286 240 A24 24 0 1 1 248 220 L248 184 L276 174 L276 166 L236 178 Z" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="266,280 252,320 274,320 260,360 294,305 274,305" fill="#FACC15" filter="url(#glow)"/>
</svg>
